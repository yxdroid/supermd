[package]
name = "supermd"
version = "0.1.2"
description = "SuperMD Markdown viewer and editor"
authors = ["SuperMD"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "supermd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
